server:
  forward-headers-strategy: framework

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
      jdbc:
        time_zone: UTC

management:
  endpoint:
    health:
      probes:
        enabled: true

app:
  database:
    # Dữ liệu production chỉ được cập nhật bằng migration/import có kiểm soát.
    seed-enabled: false
