server:
  port: ${PORT:8081}

spring:
  application:
    name: educare-backend
  config:
    import:
      # Local run from /backend uses the existing PayOS keys in the repository root.
      # Docker/production continues to prefer real environment variables.
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
      - optional:file:.env.production[.properties]
      - optional:file:../.env.production[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:../data/educare-local;AUTO_SERVER=TRUE;MODE=MySQL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${APP_JWT_SECRET:replace-this-secret-with-a-very-long-random-string}
    expiration-hours: ${APP_JWT_EXPIRATION_HOURS:168}
  admin:
    email: ${APP_ADMIN_EMAIL:admin@educare.vn}
    password: ${APP_ADMIN_PASSWORD:Admin@123}
    full-name: ${APP_ADMIN_FULL_NAME:EDUcare Admin}
    username: ${APP_ADMIN_USERNAME:educare_admin}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  payos:
    client-id: ${PAYOS_CLIENT_ID:}
    api-key: ${PAYOS_API_KEY:}
    checksum-key: ${PAYOS_CHECKSUM_KEY:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
    fallback-model: ${GEMINI_FALLBACK_MODEL:gemini-2.5-flash}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
